<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Summer Tracker: Settings</title>
    <style>
      body { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Inter, sans-serif; max-width: 520px; margin: 40px auto; padding: 0 16px; color: #0b1020; }
      @media (prefers-color-scheme: dark) { body { background: #0b1020; color: #f3f6ff; } }
      h1 { font-size: 18px; margin: 0 0 4px; }
      p { color: #6b7280; font-size: 13px; }
      label { display: block; font-size: 12px; font-weight: 500; margin: 16px 0 6px; }
      input { width: 100%; padding: 8px 10px; font-size: 14px; border: 1px solid #d1d5db; border-radius: 8px; background: transparent; color: inherit; box-sizing: border-box; }
      button { margin-top: 18px; padding: 8px 14px; font-size: 13px; border-radius: 8px; border: none; background: #3b82f6; color: white; cursor: pointer; }
      .status { margin-top: 12px; font-size: 13px; color: #16a34a; }
    </style>
  </head>
  <body>
    <h1>Summer Tracker extension settings</h1>
    <p>Point the extension at your deployed tracker URL (e.g. <code>https://your-app.vercel.app</code>). Sign in there in a normal tab first so the session cookie is available.</p>
    <label>Tracker URL</label>
    <input id="trackerUrl" placeholder="https://your-app.vercel.app" />
    <div>
      <button id="save">Save</button>
      <span id="status" class="status"></span>
    </div>
    <script src="options.js"></script>
  </body>
</html>
